# Per-container stats for the demo stack, read straight from the Docker API
# (immune to cgroup-namespace quirks that blind cAdvisor on Docker Desktop).
# Exposed as Prometheus metrics on :9273 for the manifold-prometheus scraper.

[agent]
  interval = "5s"
  round_interval = true
  omit_hostname = true

[[inputs.docker]]
  endpoint = "unix:///var/run/docker.sock"
  gather_services = false
  container_name_include = ["manifold-*"]
  timeout = "5s"
  perdevice = false
  total = true

[[outputs.prometheus_client]]
  listen = ":9273"
  metric_version = 2
  path = "/metrics"
  expiration_interval = "60s"
