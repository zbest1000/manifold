# Manifold — full local test stack.
#
#   docker compose up --build
#   → open http://localhost:5000
#
# Brings up the app plus a Mosquitto MQTT broker, a Microsoft OPC-PLC OPC UA
# server, and a data simulator. The app is pre-seeded to auto-connect to the
# broker and OPC UA server, and the simulator publishes MQTT + Sparkplug B
# traffic, so every view has live data immediately.

services:
  mqtt:
    image: eclipse-mosquitto:2
    container_name: manifold-mqtt
    hostname: mqtt
    restart: unless-stopped
    volumes:
      - ./docker/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    ports:
      - "1883:1883" # MQTT (connect external clients here too)
      - "9001:9001" # MQTT over WebSockets
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_pub -h localhost -t healthcheck -m ok || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 3s

  opcua:
    image: mcr.microsoft.com/iotedge/opc-plc:latest
    container_name: manifold-opcua
    hostname: opcua
    restart: unless-stopped
    command:
      - "--pn=50000"            # listen on :50000
      - "--autoaccept"          # auto-accept client certs (test only)
      - "--unsecuretransport"   # expose a None-security endpoint
      - "--sph"                 # show simulator node info on startup
    ports:
      - "50000:50000" # OPC UA (opc.tcp://localhost:50000)

  simulator:
    build:
      context: ./docker/simulator
    container_name: manifold-simulator
    restart: unless-stopped
    environment:
      MQTT_URL: mqtt://mqtt:1883
      TICK_MS: "1500"
      # Bigger dataset for load testing (1 ~= 350 topics, 3 ~= 1000).
      SIM_SCALE: "3"
    depends_on:
      mqtt:
        condition: service_healthy

  # Two more broker instances with DISTINCT data (site-prefixed namespaces) so
  # the Topics multi-broker view has genuinely different trees to merge.
  mqtt2:
    image: eclipse-mosquitto:2
    container_name: manifold-mqtt2
    hostname: mqtt2
    restart: unless-stopped
    volumes:
      - ./docker/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    ports:
      - "1884:1883"
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_pub -h localhost -t healthcheck -m ok || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 3s

  mqtt3:
    image: eclipse-mosquitto:2
    container_name: manifold-mqtt3
    hostname: mqtt3
    restart: unless-stopped
    volumes:
      - ./docker/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    ports:
      - "1885:1883"
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_pub -h localhost -t healthcheck -m ok || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 3s

  simulator2:
    build:
      context: ./docker/simulator
    container_name: manifold-simulator2
    restart: unless-stopped
    environment:
      MQTT_URL: mqtt://mqtt2:1883
      TICK_MS: "2000"
      SIM_SCALE: "2"
      SITE: north
    depends_on:
      mqtt2:
        condition: service_healthy

  simulator3:
    build:
      context: ./docker/simulator
    container_name: manifold-simulator3
    restart: unless-stopped
    environment:
      MQTT_URL: mqtt://mqtt3:1883
      TICK_MS: "2500"
      SIM_SCALE: "1"
      SITE: south
    depends_on:
      mqtt3:
        condition: service_healthy

  # A real EMQX broker so vendor-specific capabilities are exercised for real:
  # the client-lifecycle timeline reads its $SYS/brokers/+/clients/+/… system
  # topics, and broker-admin features can point at its REST API (:18083).
  # The mounted acl.conf is demo-permissive (default EMQX denies $SYS/# and
  # literal-# subscriptions to remote clients, which would blind Manifold).
  emqx:
    image: emqx/emqx:5.8
    container_name: manifold-emqx
    hostname: emqx
    restart: unless-stopped
    environment:
      EMQX_SYS_TOPICS__SYS_EVENT_MESSAGES__CLIENT_CONNECTED: "true"
      EMQX_SYS_TOPICS__SYS_EVENT_MESSAGES__CLIENT_DISCONNECTED: "true"
    volumes:
      - ./docker/emqx/acl.conf:/opt/emqx/etc/acl.conf:ro
    ports:
      - "127.0.0.1:1886:1883" # MQTT (host access; in-cluster it's emqx:1883)
      - "127.0.0.1:18083:18083" # EMQX dashboard (admin/public by default)
    healthcheck:
      test: ["CMD", "emqx", "ctl", "status"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  simulator4:
    build:
      context: ./docker/simulator
    container_name: manifold-simulator4
    restart: unless-stopped
    environment:
      MQTT_URL: mqtt://emqx:1883
      TICK_MS: "2000"
      SIM_SCALE: "1"
      SITE: east
    depends_on:
      emqx:
        condition: service_healthy

  # TimescaleDB historian — the 'to timescale' pipeline route writes energy/#
  # values here through the outbox, and the Trends page reads them back.
  # Credentials match the seeded 'Demo Timescale' historian config.
  timescale:
    image: timescale/timescaledb:latest-pg16
    container_name: manifold-timescale
    hostname: manifold-timescale
    restart: unless-stopped
    environment:
      POSTGRES_DB: manifold
      POSTGRES_USER: manifold
      POSTGRES_PASSWORD: demo-pass
    ports:
      - "127.0.0.1:15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U manifold -d manifold"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  # Real observability pair: Prometheus scrapes Manifold's /metrics every 5s
  # and the provisioned Grafana dashboard ("Manifold Overview") charts it —
  # ingest rates, canary round-trips, event-loop health, outbox depth.
  # Grafana: http://localhost:3001 (anonymous admin, demo only).
  prometheus:
    image: prom/prometheus:v3.2.1
    container_name: manifold-prometheus
    hostname: prometheus
    restart: unless-stopped
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:9090:9090"

  # Per-container CPU / memory / network for the whole stack (brokers,
  # simulators, the app itself) — Telegraf's Docker input reads the Docker API
  # via the socket, which works on every Docker flavor including Docker
  # Desktop (whose VM cgroup layout blinds cAdvisor). Scraped by Prometheus,
  # charted in Grafana's Containers row.
  telegraf:
    image: telegraf:1.30
    container_name: manifold-telegraf
    hostname: telegraf
    restart: unless-stopped
    user: "0" # needs to read the docker socket…
    # …and the image's entrypoint would drop privileges again, so exec
    # telegraf directly (demo stack; socket is mounted read-only).
    entrypoint: ["telegraf"]
    volumes:
      - ./docker/telegraf/telegraf.conf:/etc/telegraf/telegraf.conf:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "127.0.0.1:9273:9273"

  grafana:
    image: grafana/grafana:11.4.0
    container_name: manifold-grafana
    hostname: grafana
    restart: unless-stopped
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
      GF_AUTH_BASIC_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3001:3000"
    depends_on:
      - prometheus

  # Mock i3X server. Connect from the app at http://i3x:8080 (i3X page or
  # Discovery, which probes port 8080). Serves a small ISA-95 object hierarchy.
  i3x:
    build:
      context: ./docker/i3x-mock
    container_name: manifold-i3x
    hostname: i3x
    restart: unless-stopped
    environment:
      PORT: "8080"
    ports:
      # Host loopback so you can `curl http://localhost:18080/info` directly. The
      # app reaches it in-cluster as http://i3x:8080 regardless of this mapping.
      - "127.0.0.1:18080:8080"

  app:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    container_name: manifold-app
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "5000"
      MANIFOLD_DATA_DIR: /data
      # Bind all interfaces INSIDE the container so the port mapping works; the
      # host-side mapping below (127.0.0.1) is what keeps it off the network.
      MANIFOLD_HOST: "0.0.0.0"
      # This is a local-only demo (mapped to host loopback), so let Discovery scan
      # the demo's Docker subnet and reach the bundled broker/OPC UA. The shipped
      # default is fail-closed — do NOT set this on an internet-exposed instance.
      MANIFOLD_ALLOW_PRIVATE_TARGETS: "1"
      # This demo runs UNAUTHENTICATED. To expose it beyond this host you MUST
      # set a token AND widen the port mapping below to "5000:5000".
      # MANIFOLD_AUTH_TOKEN: set-a-secret-to-require-auth
    volumes:
      - app-data:/data # persists connection profiles across restarts
    ports:
      # Host loopback only — reachable at http://localhost:5000 but NOT from other
      # machines on the LAN. Widen to "5000:5000" only after setting a token.
      - "127.0.0.1:5000:5000"
    depends_on:
      mqtt:
        condition: service_healthy
      opcua:
        condition: service_started

volumes:
  app-data:
